name: Native plugin release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            os: ubuntu-latest
          - target: darwin-arm64
            os: ubuntu-latest
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -n '1p' VERSION)"
          go run ./cmd/codex-plugin package --target "$TARGET" --version "$version"
      - name: Validate extracted package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -n '1p' VERSION)"
          extract_dir="$(mktemp -d)"
          unzip -q "dist/release/ai-software-architect-v$version-$TARGET.zip" -d "$extract_dir"
          go run ./cmd/codex-plugin validate --target "$TARGET" "$extract_dir"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ai-software-architect-${{ matrix.target }}
          path: |
            dist/release/ai-software-architect-*.zip
            dist/release/ai-software-architect-*.zip.sha256

  linux-smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Smoke test Linux amd64 runtime
        run: make smoke-linux
