name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check generated schemas
        run: go run ./cmd/generate-schemas --check
      - name: Build all native runtimes
        run: make build-all
      - name: Smoke test Linux runtime
        run: make smoke-linux
      - name: Package and extract Linux plugin
        shell: bash
        run: |
          version="$(sed -n '1p' VERSION)"
          go run ./cmd/codex-plugin package --target linux-amd64 --version "$version"
          extract_dir="$(mktemp -d)"
          unzip -q "dist/release/ai-software-architect-v$version-linux-amd64.zip" -d "$extract_dir"
          go run ./cmd/codex-plugin validate --target linux-amd64 "$extract_dir"
          "$extract_dir/runtime/linux-amd64/ai-architect-runtime/ai-architect-runtime" --repository-snapshot --root . > "$extract_dir/snapshot.json"
          test -s "$extract_dir/snapshot.json"

  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
            binary: ai-architect-runtime.exe
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            binary: ai-architect-runtime
          - target: linux-amd64
            goos: linux
            goarch: amd64
            binary: ai-architect-runtime
          - target: linux-arm64
            goos: linux
            goarch: arm64
            binary: ai-architect-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-X main.version=$(sed -n '1p' VERSION)" -o "dist/${{ matrix.target }}/${{ matrix.binary }}" ./cmd/ai-architect-runtime

  native-host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-amd64
          - os: macos-14
            host: darwin-arm64
          - os: windows-latest
            host: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native filesystem and path tests (${{ matrix.host }})
        run: go test ./internal/architect ./internal/codex
